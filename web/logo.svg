<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fd36a"/>
      <stop offset="0.55" stop-color="#17a64a"/>
      <stop offset="1" stop-color="#0b6b30"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.35" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#22304c"/>
      <stop offset="1" stop-color="#0d1424"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.14"/>

  <!-- caparazón -->
  <g filter="url(#soft)">
    <ellipse cx="32" cy="36" rx="21" ry="16" fill="url(#shell)"/>
    <path d="M32 20c6 0 11 2.2 14.6 6.1-4.6-2-9.4-3-14.6-3s-10 1-14.6 3C21 22.2 26 20 32 20z"
          fill="url(#gloss)"/>
    <!-- placas -->
    <path d="M32 22.5l7.5 12.5h-15z" fill="#0e7a37" fill-opacity="0.55"/>
    <path d="M32 49.5L18 36.5h8.5zM32 49.5l14-13h-8.5z" fill="#0e7a37" fill-opacity="0.42"/>
    <path d="M32 22.5l7.5 12.5h-15z" fill="none" stroke="#0a5c2a" stroke-opacity="0.55"/>
    <path d="M17.4 35.6h29.2" stroke="#0a5c2a" stroke-opacity="0.45" stroke-width="1.2"/>
  </g>

  <!-- línea de tendencia -->
  <path d="M13 31l8-7 7 5 8-11 7 6 8-5" fill="none" stroke="url(#plate)"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="51" cy="19" r="3.4" fill="#8fd0ff"/>
  <circle cx="51" cy="19" r="3.4" fill="none" stroke="#eaf4ff" stroke-opacity="0.8"/>

  <!-- cabeza y patas -->
  <g fill="#22b356">
    <ellipse cx="56" cy="40" rx="5.2" ry="4.4"/>
    <circle cx="57.4" cy="39" r="1.05" fill="#0b1a12"/>
    <ellipse cx="14" cy="45.5" rx="4.6" ry="3.4"/>
    <ellipse cx="22" cy="51.5" rx="4.2" ry="2.6"/>
    <ellipse cx="42" cy="51.5" rx="4.2" ry="2.6"/>
  </g>
</svg>
